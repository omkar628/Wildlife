# Default application settings.
# Environment variables prefixed with WI_ override these values.
# Example: WI_CONFIDENCE_AUTO_ACCEPT=0.70

confidence:
  # Detections at or above this value are accepted automatically.
  auto_accept: 0.60
  # Detections below this value are discarded (not sent to review).
  detect_min: 0.15

detector:
  batch_size: 8
  imgsz: 640
  # auto | cpu | cuda | cuda:0
  device: auto
  # Ultralytics internal cutoff. Keep this at or below detect_min.
  # Application-level filtering uses confidence.auto_accept.
  yolo_conf: 0.15

classes:
  0: tiger
  1: prey
  2: rival
  3: human

crops:
  # Extra padding around the YOLO box, as a fraction of box size.
  padding: 0.05
  jpeg_quality: 95

reid:
  enabled: true
  # Hugging Face id. Downloaded once into the local HF cache; not re-fetched per image.
  model_id: BVRA/MegaDescriptor-S-224
  # Optional timm source override (local path or hf-hub:...). Leave empty to use model_id.
  model_path: ""
  # auto | cpu | cuda | cuda:0
  device: auto
  # Provisional auto-assign cosine. NOT the ATRW "0.7" rule.
  # ATRW different-individual cosine reached 0.70 while same-individual
  # cosine dipped to 0.32, so 0.70 is not a safe production cutoff.
  # 0.90 is a conservative field default: uncertain matches go to review.
  match_threshold: 0.90
  # Below this, do not even suggest a local ID. Still stays unidentified.
  review_threshold: 0.55
  # Auto-assign only if top-1 beats top-2 by at least this cosine gap.
  min_margin: 0.05

gnn:
  # auto | cpu | cuda | cuda:0
  device: auto

alerts:
  # Same identified tiger at the same camera this many times.
  repeat_threshold: 3
  # Minimum accepted detections at one camera before unusual-activity is considered.
  unusual_min_detections: 4

paths:
  database: database/wildlife.db
  crops: data/crops
  classified: data/classified
  logs: logs
  reports: reports

server:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
